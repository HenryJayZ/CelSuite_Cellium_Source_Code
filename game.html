<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <title>Celium: Neon Space Arena</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { background: #050714; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
 canvas { display: block; margin: 0 auto; background: radial-gradient(ellipse at center, #1a1f3d 0%, #020408 100%); }
 #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
 .hud-top { display: flex; justify-content: space-between; padding: 20px; color: #4ff; text-shadow: 0 0 10px #4ff; font-size: 18px; font-weight: bold; }
 .score-box, .health-bar, .ammo-box { background: rgba(79, 68, 255, 0.2); padding: 10px 20px; border-radius: 10px; border: 1px solid #4ff; }
 .health-fill { width: 100%; height: 20px; background: linear-gradient(90deg, #f33, #c55); margin-top: 5px; }
 .health-bar div { width: 80%; height: 100%; background: #0f5; transition: width 0.3s ease; }
 #game-over { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; pointer-events: auto; }
 #game-over h1 { font-size: 64px; color: #f33; text-shadow: 0 0 30px #f33; margin-bottom: 20px; }
 #start-btn { background: linear-gradient(45deg, #4ff, #0aa); border: none; padding: 15px 40px; color: #fff; font-size: 24px; cursor: pointer; border-radius: 30px; margin-top: 30px; box-shadow: 0 0 30px rgba(79, 68, 255, 0.8); transition: transform 0.2s, box-shadow 0.2s; }
 #start-btn:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(79, 68, 255, 1); }
 .powerup-bar { display: flex; gap: 10px; padding: 15px; justify-content: center; }
 .powerup { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #fff; }
 .p-shield { background: rgba(100, 200, 255, 0.6); color: #4ff; box-shadow: 0 0 15px rgba(79, 255, 255, 0.8); }
 .p-speed { background: rgba(255, 200, 50, 0.6); color: #fa5; box-shadow: 0 0 15px rgba(255, 190, 10, 0.8); }
 .p-multi { background: rgba(255, 100, 100, 0.6); color: #f33; box-shadow: 0 0 15px rgba(255, 50, 10, 0.8); }
 .instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; text-align: center; width: 600px; pointer-events: none; }
 </style>
</head>
<body>
 <canvas id="gameCanvas"></canvas>
 <div id="ui-layer">
 <div class="hud-top">
 <div class="score-box">SCORE: <span id="scoreDisplay">0</span></div>
 <div class="health-bar"><div id="healthFill" style="width: 100%;"></div><small>HP: <span id="hpDisplay">100</span>%</small></div>
 <div class="ammo-box">AMMO: <span id="ammoDisplay">∞</span></div>
 </div>
 <div class="powerup-bar" style="display: none;">
 <div class="powerup p-shield">🛡️</div>
 <div class="powerup p-speed">⚡</div>
 <div class="powerup p-multi">💥</div>
 </div>
 </div>

 <div id="game-over">
 <h1>GAME OVER</h1>
 <p style="font-size: 24px; margin-bottom: 10px;">FINAL SCORE: <span id="finalScore">0</span></p>
 <button id="start-btn" onclick="startGame()">RESTART MISSION ▶️</button>
 </div>

 <div class="instructions">
 WASD / Arrow Keys to Move • SPACE to Shoot • P = Shield | L = Speed Boost | K = Multi-Shot
 </div>
